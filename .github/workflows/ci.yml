name: VulnTrace CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Suite (Python 3.11)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install ruff pytest pytest-asyncio httpx sse-starlette fastapi uvicorn pyyaml

    - name: Run Ruff Linting
      run: |
        ruff check vulntrace/ tests/

    - name: Run Deterministic Offline Test Suite
      id: run_tests
      continue-on-error: true
      run: |
        pytest -v -m "not container and not live_network" tests/ 2>&1 | tee pytest_output.txt
        echo "TEST_EXIT=${PIPESTATUS[0]}" >> $GITHUB_ENV

    - name: Publish Test Summary
      if: always()
      run: |
        echo "### Pytest Execution Summary" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        tail -n 120 pytest_output.txt >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        if [ "$TEST_EXIT" != "0" ]; then
          echo "Test suite failed with exit code $TEST_EXIT"
          exit 1
        fi


