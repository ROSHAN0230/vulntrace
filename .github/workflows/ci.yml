name: VulnTrace CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
    - name: Checkout repository with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install ruff pytest pytest-asyncio httpx sse-starlette fastapi uvicorn pyyaml

    - name: Run Ruff Linting
      run: |
        ruff check vulntrace/ tests/

    - name: Run Deterministic Offline Test Suite
      run: |
        pytest -v -m "not container and not live_network" tests/

  tier1-container:
    name: Tier 1 Container Isolation Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install ruff pytest pytest-asyncio httpx sse-starlette fastapi uvicorn pyyaml

    - name: Build and register base sandbox container image
      run: |
        cat << 'EOF' | podman build -t vulntrace-sandbox-base:latest -
        FROM python:3.11-slim
        RUN apt-get update && apt-get install -y --no-install-recommends gcc python3-dev && rm -rf /var/lib/apt/lists/*
        RUN pip install --no-cache-dir pyyaml pytest pytest-asyncio
        RUN useradd -m -u 1000 agent
        USER agent
        WORKDIR /workspace
        EOF
        podman image exists vulntrace-sandbox-base:latest
        echo "Base container image registered successfully."

    - name: Run Tier 1 Container Isolation Test Suite
      run: |
        pytest -v -m "container" tests/
