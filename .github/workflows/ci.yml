name: VulnTrace CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Suite (Python 3.11)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install ruff pytest pytest-asyncio httpx sse-starlette fastapi uvicorn pyyaml

    - name: Run Ruff Linting
      run: |
        ruff check vulntrace/ tests/

    - name: Run Deterministic Offline Test Suite
      id: run_tests
      shell: bash
      run: |
        set -o pipefail
        pytest -v -m "not container and not live_network" tests/ 2>&1 | tee pytest_output.txt

    - name: Upload Test Output Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pytest-offline-log
        path: pytest_output.txt
        if-no-files-found: warn

    - name: Emit Annotations on Failure
      if: failure()
      run: |
        python -c "
        with open('pytest_output.txt') as f:
            lines = [l.strip() for l in f.readlines() if l.strip()]
        failed_lines = [l for l in lines if 'FAILED' in l or 'ERROR' in l]
        for l in failed_lines[:20]:
            print(f'::error title=Test Failure::{l}')
        for l in lines[-40:]:
            print(f'::notice title=Summary::{l}')
        "
