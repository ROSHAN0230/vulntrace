name: VulnTrace CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install ruff pytest pytest-asyncio httpx sse-starlette fastapi uvicorn pyyaml

    - name: Run Ruff Linting
      run: |
        ruff check vulntrace/ tests/

    - name: Run Test Suite
      run: |
        pytest -v -m "not container" tests/
