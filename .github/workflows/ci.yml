name: VulnTrace CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  test:
    name: Test Suite (Python 3.11)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install ruff pytest pytest-asyncio httpx sse-starlette fastapi uvicorn pyyaml

    - name: Run Ruff Linting
      run: |
        ruff check vulntrace/ tests/

    - name: Run Deterministic Offline Test Suite
      id: run_tests
      continue-on-error: true
      run: |
        pytest -v -m "not container and not live_network" tests/ > pytest_output.txt 2>&1
        echo "TEST_EXIT=$?" >> $GITHUB_ENV

    - name: Publish Test Output on Failure
      if: env.TEST_EXIT != '0'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git checkout --orphan ci-debug
        git reset
        git add -f pytest_output.txt
        git commit -m "debug: pytest execution log from CI"
        git push origin ci-debug --force
        exit 1



